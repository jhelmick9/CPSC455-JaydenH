<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Trades | The Card Locker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <div class="header">
            <div class="header-inner">
                <img src="image.png" alt="The Card Locker logo">
                <h1>The Card Locker</h1>
            </div>
        </div>

    <div class="nav">
        <a href="index.html">Home</a>
        <a href="trade.html">Trades</a>
        <a href="newTrade.html">New Trade</a>
        <a href="#">Login</a>
        <a href="#">Signup</a>
    </div>

    <div class="main">
        <h2>Search Trades</h2>

        <form id="searchForm" class="search-form">
            <label>
                Player name
                <input type="text" id="q-name" class="input" placeholder="e.g. Mike Trout">
            </label>
            <label>
                Year
                <input type="text" id="q-year" class="input" placeholder="e.g. 2022">
            </label>
            <label>
                Condition
                <select id="q-condition" class="input">
                    <option value="">Any</option>
                    <option>Mint</option>
                    <option>Near Mint</option>
                    <option>Good</option>
                    <option>Poor</option>
                </select>
            </label>
            <button type="submit" class="btn">Search</button>
        </form>

    </div> 

    <div class="footer">
        <div class="footer-inner">
            <div>
                About Us | Contact
            </div>
            <div>
                © 2026 The Card Locker
            </div>
        </div>
    </div>


</body>
</html>
